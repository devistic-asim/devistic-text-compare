name: Feature request
description: Suggest an improvement to Devistic Text Compare.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to compare, and where does the tool get in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool do? Mention if it must stay entirely in the browser.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
